<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>汽车流水线模拟器 - 动态版</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #container {
            position: relative;
        }
        canvas {
            border: 1px solid #333;
            display: block;
        }
        #panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: #ccc;
            padding: 10px;
            font-size: 13px;
            border-radius: 6px;
            user-select: none;
        }
        #panel div { margin: 3px 0; }
        button {
            margin: 5px 3px;
            padding: 4px 8px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover { background: #666; }
    </style>
</head>
<body>
<div id="container">
    <canvas id="simCanvas"></canvas>
    <div id="panel">
        <div> 模拟时间: <span id="simTime">0.0</span> s</div>
        <div> 产量: <span id="totalProd">0</span></div>
        <div> 产线上车辆: <span id="carCount">0</span></div>
        <div> 速度: <span id="speedVal">1x</span></div>
        <button onclick="changeSpeed(1)">+</button>
        <button onclick="changeSpeed(-1)">-</button>
        <button onclick="togglePause()">暂停/继续</button>
        <button onclick="resetSim()">重置</button>
        <div style="margin-top:8px;"> 正常 ·  异常/停线</div>
    </div>
</div>

<script>
    // ==================== 用户自定义参数区 ====================
    const NUM_STATIONS = 10;                       // 工位数量
    // 每个工位的标准操作时间（秒），可以改成任何你想要的工序时间
    const BASE_TIMES = [20, 15, 25, 18, 22, 16, 28, 14, 19, 30];
    // 目标节拍（车辆释放间隔，秒）
    const TARGET_TAKT = 60;
    // 疲劳相关
    const FATIGUE_PER_SEC = 0.4;          // 每工作1秒累积的疲劳值
    const FATIGUE_IMPACT = 1.0;           // 疲劳对操作时间的影响系数（时间 = 标准 * (1 + 疲劳/100)）
    const REST_RECOVERY = 0.3;            // 员工在空闲/走回时每秒恢复的疲劳值
    // 错配/停线
    const DEFECT_BASE = 0.01;             // 基础错配概率
    const DEFECT_FATIGUE_FACTOR = 0.0008; // 疲劳对错配率增量（概率 = 基础 + 疲劳 * 因子）
    const RECOVERY_TIME = 45;             // 错配后停线恢复时间（秒）
    // 移动速度（像素/秒）
    const WALK_SPEED = 100;               // 员工走动速度
    const VEHICLE_MOVE_SPEED = 80;        // 车辆在工位间移动的速度
    const CART_SPEED = 70;                // 物料小车移动速度
    // 视觉尺寸
    const CANVAS_WIDTH = 1500;
    const CANVAS_HEIGHT = 600;
    const STATION_SPACING = 130;          // 工位水平间距
    const START_X = 80;
    const BELT_TOP_Y = 250;
    const BELT_BOTTOM_Y = 350;
    const CAR_WIDTH = 70;
    const CAR_HEIGHT = 100;
    const WORKER_SIZE = 16;

    // ==================== 初始化 Canvas ====================
    const canvas = document.getElementById('simCanvas');
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;
    const ctx = canvas.getContext('2d');

    // ==================== 模拟引擎 ====================
    class Vehicle {
        constructor(id) {
            this.id = id;
            this.x = START_X - CAR_WIDTH;     // 从左侧外驶入
            this.y = (BELT_TOP_Y + BELT_BOTTOM_Y) / 2 - CAR_HEIGHT/2;
            this.currentStation = 0;          // 下一个要到达的工位索引
            this.state = 'entering';          // entering, moving_to_station, processing, moving_next, done, blocked, abnormal
            this.isDefective = false;
            this.processingStation = null;
            this.progress = 0;                // 移动进度 0~1
            this.moveTargetX = 0;
            this.moveStartX = 0;
        }
    }

    class Worker {
        constructor(station) {
            this.station = station;           // 所属工位对象
            this.homeX = station.x;           // 家位置（工位x）
            this.homeY = station.side === 'top' ? BELT_TOP_Y - 50 : BELT_BOTTOM_Y + 50;
            this.x = this.homeX;
            this.y = this.homeY;
            this.fatigue = 0;
            this.state = 'idle';              // idle, walking_to_car, working, walking_back, abnormal
            this.targetX = this.homeX;
            this.targetY = this.homeY;
            this.currentVehicle = null;
            this.workRemaining = 0;
            this.walkSpeed = WALK_SPEED;
        }

        moveTowardsTarget(dt) {
            const dx = this.targetX - this.x;
            const dy = this.targetY - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 2) {
                this.x = this.targetX;
                this.y = this.targetY;
                return true; // 到达
            }
            const step = this.walkSpeed * dt;
            if (step >= dist) {
                this.x = this.targetX;
                this.y = this.targetY;
                return true;
            }
            this.x += (dx / dist) * step;
            this.y += (dy / dist) * step;
            return false;
        }
    }

    class Station {
        constructor(idx, baseTime) {
            this.idx = idx;
            this.baseTime = baseTime;
            // 工位位置：奇数索引在下侧，偶数在上侧（交替）
            this.side = (idx % 2 === 0) ? 'top' : 'bottom';
            this.x = START_X + idx * STATION_SPACING + STATION_SPACING/2;
            this.y = this.side === 'top' ? BELT_TOP_Y - 20 : BELT_BOTTOM_Y + 20;
            this.worker = new Worker(this);
            this.isAbnormal = false;
            this.recoveryTimer = 0;
            this.totalProcessed = 0;
            // 工位输入/输出占位
            this.hasVehicle = false;       // 当前是否有车正在此工位被处理
            this.vehicle = null;
            // 物料小车补给点（简单标记）
            this.needsSupply = false;
        }
    }

    // 物料小车
    class MaterialCart {
        constructor(side) {
            this.side = side;            // 'top' or 'bottom'
            this.y = side === 'top' ? BELT_TOP_Y - 85 : BELT_BOTTOM_Y + 85;
            this.x = -30;
            this.speed = CART_SPEED;
            this.active = false;
            this.targetStation = null;
            this.arrived = false;
            this.supplyTime = 0;
        }
    }

    // 全局变量
    let stations = [];
    let vehicles = [];
    let carts = [];
    let simTime = 0;
    let nextVehicleGen = 0;
    let vehicleCounter = 0;
    let totalProduced = 0;
    let paused = false;
    let simSpeed = 1;
    let lastTimestamp = null;

    // 初始化
    function initSim() {
        stations = [];
        for (let i = 0; i < NUM_STATIONS; i++) {
            stations.push(new Station(i, BASE_TIMES[i]));
        }
        vehicles = [];
        carts = [
            new MaterialCart('top'),
            new MaterialCart('bottom')
        ];
        simTime = 0;
        nextVehicleGen = 0;
        vehicleCounter = 0;
        totalProduced = 0;
        lastTimestamp = null;
    }
    initSim();

    // ==================== 更新逻辑 ====================
    function updateSim(dt) {
        simTime += dt;
        // 1. 生成新车
        while (simTime >= nextVehicleGen) {
            const v = new Vehicle(vehicleCounter++);
            v.state = 'entering';
            vehicles.push(v);
            nextVehicleGen += TARGET_TAKT;
        }

        // 2. 更新所有车辆
        for (let v of vehicles) {
            if (v.state === 'entering') {
                // 驶入第一个工位
                v.state = 'moving_to_station';
                v.currentStation = 0;
                const st = stations[0];
                v.moveStartX = v.x;
                v.moveTargetX = st.x - CAR_WIDTH/2;
                v.progress = 0;
            } else if (v.state === 'moving_to_station' || v.state === 'moving_next') {
                // 朝目标工位移动
                const dist = v.moveTargetX - v.x;
                const step = VEHICLE_MOVE_SPEED * dt;
                if (Math.abs(dist) <= step) {
                    v.x = v.moveTargetX;
                    // 到达工位，判断是否可以开始处理
                    const st = stations[v.currentStation];
                    if (!st.isAbnormal && !st.hasVehicle) {
                        v.state = 'processing';
                        v.processingStation = st;
                        st.hasVehicle = true;
                        st.vehicle = v;
                        // 唤起员工
                        const w = st.worker;
                        if (w.state === 'idle') {
                            w.state = 'walking_to_car';
                            w.targetX = v.x + CAR_WIDTH/2;
                            w.targetY = v.y + CAR_HEIGHT/2 - WORKER_SIZE/2;
                        }
                    } else {
                        // 阻塞：停在原地不动（实际车应该停在当前x等待）
                        v.state = 'blocked';
                    }
                } else {
                    v.x += Math.sign(dist) * step;
                }
            } else if (v.state === 'blocked') {
                // 等待，再次尝试进入工位
                const st = stations[v.currentStation];
                if (!st.isAbnormal && !st.hasVehicle) {
                    v.state = 'processing';
                    v.processingStation = st;
                    st.hasVehicle = true;
                    st.vehicle = v;
                    const w = st.worker;
                    if (w.state === 'idle') {
                        w.state = 'walking_to_car';
                        w.targetX = v.x + CAR_WIDTH/2;
                        w.targetY = v.y + CAR_HEIGHT/2 - WORKER_SIZE/2;
                    }
                }
            }
        }

        // 3. 更新工位与员工
        for (let st of stations) {
            // 异常恢复
            if (st.isAbnormal) {
                st.recoveryTimer -= dt;
                if (st.recoveryTimer <= 0) {
                    st.isAbnormal = false;
                    st.worker.state = 'idle';
                    st.worker.fatigue = Math.max(0, st.worker.fatigue - 20); // 恢复后体力部分恢复
                    if (st.hasVehicle) {
                        const v = st.vehicle;
                        st.hasVehicle = false;
                        st.vehicle = null;
                        // 缺陷车移出主线（简化：直接移除）
                        vehicles = vehicles.filter(ve => ve !== v);
                    }
                }
                // 异常中停止一切正常活动，员工变红
                st.worker.state = 'abnormal';
                continue;
            }

            const w = st.worker;

            // 员工状态机
            if (w.state === 'walking_to_car') {
                const arrived = w.moveTowardsTarget(dt);
                if (arrived) {
                    // 开始工作
                    w.state = 'working';
                    w.currentVehicle = st.vehicle;
                    const fatigueFactor = 1 + (w.fatigue / 100) * FATIGUE_IMPACT;
                    w.workRemaining = st.baseTime * fatigueFactor;
                }
            } else if (w.state === 'working') {
                w.workRemaining -= dt;
                w.fatigue += FATIGUE_PER_SEC * dt; // 持续累积疲劳
                if (w.workRemaining <= 0) {
                    // 工作完成，判断错配
                    const defectProb = DEFECT_BASE + w.fatigue * DEFECT_FATIGUE_FACTOR;
                    if (Math.random() < defectProb) {
                        // 错配！进入异常
                        st.isAbnormal = true;
                        st.recoveryTimer = RECOVERY_TIME;
                        w.state = 'abnormal';
                        if (st.vehicle) st.vehicle.isDefective = true;
                    } else {
                        // 正常完成
                        w.state = 'walking_back';
                        w.targetX = w.homeX;
                        w.targetY = w.homeY;
                        w.currentVehicle = null;
                        st.totalProcessed++;
                        // 车辆可以离开到下一工位
                        if (st.vehicle) {
                            const v = st.vehicle;
                            st.hasVehicle = false;
                            st.vehicle = null;
                            if (st.idx === NUM_STATIONS - 1) {
                                // 下线
                                totalProduced++;
                                vehicles = vehicles.filter(ve => ve !== v);
                            } else {
                                v.state = 'moving_next';
                                v.currentStation = st.idx + 1;
                                const nextSt = stations[st.idx + 1];
                                v.moveStartX = v.x;
                                v.moveTargetX = nextSt.x - CAR_WIDTH/2;
                            }
                        }
                    }
                }
            } else if (w.state === 'walking_back') {
                const arrived = w.moveTowardsTarget(dt);
                // 走回过程中体力恢复
                w.fatigue = Math.max(0, w.fatigue - REST_RECOVERY * dt);
                if (arrived) {
                    w.state = 'idle';
                    // 如果此时有新车到工位且空闲，立即分配
                    if (st.hasVehicle && st.vehicle.state === 'processing' && w.state === 'idle') {
                        w.state = 'walking_to_car';
                        w.targetX = st.vehicle.x + CAR_WIDTH/2;
                        w.targetY = st.vehicle.y + CAR_HEIGHT/2 - WORKER_SIZE/2;
                    }
                }
            } else if (w.state === 'idle') {
                // 空闲时恢复体力
                w.fatigue = Math.max(0, w.fatigue - REST_RECOVERY * dt);
                // 检查是否来了新车
                if (st.hasVehicle && st.vehicle.state === 'processing') {
                    w.state = 'walking_to_car';
                    w.targetX = st.vehicle.x + CAR_WIDTH/2;
                    w.targetY = st.vehicle.y + CAR_HEIGHT/2 - WORKER_SIZE/2;
                }
            }
        }

        // 4. 物料小车逻辑
        for (let cart of carts) {
            if (!cart.active) {
                // 随机时间发车
                if (Math.random() < 0.005 * dt * 20) { // 大约每10秒可能发车
                    cart.active = true;
                    cart.x = -20;
                    // 随机选一个需要补给的工位（这里简化成每隔几个工位）
                    const targetIdx = Math.floor(Math.random() * NUM_STATIONS);
                    cart.targetStation = stations[targetIdx];
                    cart.arrived = false;
                    cart.supplyTime = 0;
                }
            } else {
                if (!cart.arrived) {
                    const targetX = cart.targetStation.x - 10;
                    const dist = targetX - cart.x;
                    const step = cart.speed * dt;
                    if (Math.abs(dist) <= step) {
                        cart.x = targetX;
                        cart.arrived = true;
                        cart.supplyTime = 4; // 停留4秒卸物料
                    } else {
                        cart.x += Math.sign(dist) * step;
                    }
                } else {
                    cart.supplyTime -= dt;
                    if (cart.supplyTime <= 0) {
                        // 返回（从右侧消失再重生）
                        cart.active = false;
                    }
                }
            }
        }
    }

    // ==================== 绘制 ====================
    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // 绘制传送带轨道（两条白色线）
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, BELT_TOP_Y);
        ctx.lineTo(CANVAS_WIDTH, BELT_TOP_Y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, BELT_BOTTOM_Y);
        ctx.lineTo(CANVAS_WIDTH, BELT_BOTTOM_Y);
        ctx.stroke();

        // 绘制工位标记（灰色小方框）
        for (let st of stations) {
            ctx.strokeStyle = st.isAbnormal ? '#f00' : '#888';
            ctx.lineWidth = 1.5;
            const x = st.x;
            const y = st.y;
            ctx.strokeRect(x - 15, y - 10, 30, 20);
            ctx.fillStyle = '#aaa';
            ctx.font = '12px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.fillText(st.idx + 1, x, y + 4);
        }

        // 绘制物料车轨道（虚线效果简化）
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(20, BELT_TOP_Y - 85);
        ctx.lineTo(CANVAS_WIDTH - 20, BELT_TOP_Y - 85);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(20, BELT_BOTTOM_Y + 85);
        ctx.lineTo(CANVAS_WIDTH - 20, BELT_BOTTOM_Y + 85);
        ctx.stroke();
        ctx.setLineDash([]); // 重置

        // 绘制车辆
        for (let v of vehicles) {
            const isDefect = v.isDefective || (v.processingStation && v.processingStation.isAbnormal);
            ctx.fillStyle = isDefect ? '#f00' : '#fff';
            ctx.fillRect(v.x, v.y, CAR_WIDTH, CAR_HEIGHT);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.strokeRect(v.x, v.y, CAR_WIDTH, CAR_HEIGHT);
            // 车号
            ctx.fillStyle = isDefect ? '#fff' : '#000';
            ctx.font = '10px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.fillText(v.id, v.x + CAR_WIDTH/2, v.y + CAR_HEIGHT/2 + 3);
        }

        // 绘制员工
        for (let st of stations) {
            const w = st.worker;
            let color = '#0f0';
            if (st.isAbnormal || w.state === 'abnormal') color = '#f00';
            else if (w.state === 'working') color = '#00cc00'; // 工作稍深绿
            ctx.fillStyle = color;
            ctx.fillRect(w.x - WORKER_SIZE/2, w.y - WORKER_SIZE/2, WORKER_SIZE, WORKER_SIZE);
            // 疲劳值显示
            ctx.fillStyle = '#ddd';
            ctx.font = '10px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.fillText(w.fatigue.toFixed(0) + '%', w.x, w.y - 12);
        }

        // 绘制物料小车
        for (let cart of carts) {
            if (!cart.active) continue;
            ctx.fillStyle = '#ffaa00';
            ctx.fillRect(cart.x - 8, cart.y - 6, 16, 12);
            ctx.fillStyle = '#000';
            ctx.font = '9px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.fillText('', cart.x, cart.y - 8);
        }

        // 更新面板数据
        document.getElementById('simTime').textContent = simTime.toFixed(1);
        document.getElementById('totalProd').textContent = totalProduced;
        document.getElementById('carCount').textContent = vehicles.length;
        document.getElementById('speedVal').textContent = simSpeed + 'x';
    }

    // ==================== 动画循环 ====================
    function gameLoop(ts) {
        if (lastTimestamp === null) lastTimestamp = ts;
        const realDt = Math.min(0.1, (ts - lastTimestamp) / 1000); // 帧率保护
        lastTimestamp = ts;

        if (!paused && realDt > 0) {
            updateSim(realDt * simSpeed);
        }
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ==================== 控制 ====================
    function togglePause() { paused = !paused; }
    function changeSpeed(delta) { simSpeed = Math.max(1, Math.min(50, simSpeed + delta)); }
    function resetSim() { initSim(); lastTimestamp = null; }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); togglePause(); }
        else if (e.code === 'ArrowUp') { e.preventDefault(); changeSpeed(1); }
        else if (e.code === 'ArrowDown') { e.preventDefault(); changeSpeed(-1); }
        else if (e.code === 'KeyR') { e.preventDefault(); resetSim(); }
    });

    // 启动
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
